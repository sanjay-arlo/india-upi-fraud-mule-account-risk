name: Build and deploy industry dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate or verify project dataset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('sample_upi_fraud_signals_india.csv')
          if not p.exists():
              h=['case_id','fraud_pattern','account_channel','loss_amount_inr','hours_to_report','new_payee_flag','device_change_flag','urgency_language_flag','unusual_amount_flag','mule_flag','risk_score','amount_recovered_inr']; pats=['Account Takeover','Fake Merchant','Investment Scam','Remote Access','Phishing','Mule Account','Social Engineering']; chans=['UPI','QR','Collect','AutoPay']
              with p.open('w',newline='',encoding='utf-8') as f:
                  w=csv.writer(f); w.writerow(h)
                  for i in range(1,301):
                      pat=pats[(i-1)%7]; ch=chans[(i*3)%4]; loss=1000+(i*24791)%240000; hrs=1+(i*13)%96; np=int(i%4==0 or i%9==0); dc=int(i%7==0); urg=int(i%3==0); ua=int(i%5 in (0,1)); mule=int(pat=='Mule Account' or i%17==0); risk=round(min(99,25+np*15+dc*15+urg*10+ua*12+mule*20+min(20,loss/15000)),1); rec=round(loss*(.05+((i*5)%55)/100)) if hrs<24 else round(loss*(.02+((i*3)%20)/100)); w.writerow([f'UPI-{i:05d}',pat,ch,loss,hrs,np,dc,urg,ua,mule,risk,rec])
          PY
      - name: Build dashboard bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dashboard
          curl -fsSL https://raw.githubusercontent.com/sanjay-arlo/chennai-water-security-tanker-allocation/main/dashboard/index.html -o dashboard/index.html
          curl -fsSL https://raw.githubusercontent.com/sanjay-arlo/chennai-water-security-tanker-allocation/main/dashboard/app.js -o dashboard/app.js
          cp sample_upi_fraud_signals_india.csv dashboard/data.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard sample_upi_fraud_signals_india.csv
          if ! git diff --cached --quiet; then git commit -m 'feat: build industry dashboard and dataset [skip ci]'; git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dashboard}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
